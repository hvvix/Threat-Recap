name: email-digest

# Emails for subscribers (Buttondown). Everyone who subscribes gets both:
#   weekly digest  - every Wednesday 13:17 UTC
#   monthly recap  - the 1st of each month 06:23 UTC, covering the month that just ended
# (Odd minutes on purpose: GitHub's scheduler delays or drops runs at busy times like :00.)
# Emails are saved as drafts in Buttondown unless the DIGEST_AUTOSEND variable is "true".
# Nothing runs until the BUTTONDOWN_USER variable is set.
on:
  schedule:
    - cron: "17 13 * * 3"
    - cron: "23 6 1 * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Which email to create
        type: choice
        options: [weekly, monthly]
        default: weekly

permissions:
  contents: read

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.BUTTONDOWN_USER != '' }}
    env:
      KIND: ${{ inputs.kind || (github.event.schedule == '23 6 1 * *' && 'monthly') || 'weekly' }}
      HIDE_SECTIONS: ${{ vars.HIDE_SECTIONS || 'plugins,wall' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-
      - run: node build.js
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
      - run: node digest.js --$KIND
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DIGEST_AUTOSEND: ${{ vars.DIGEST_AUTOSEND }}
          SITE_URL: ${{ vars.SITE_URL }}
