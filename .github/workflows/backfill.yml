name: backfill

# One-off: rebuild this year's news history from the Wayback Machine and download
# every CVE of the year. Run it once from the Actions tab; it takes about 5 hours (mostly polite, rate-limited Wayback Machine requests).
on:
  workflow_dispatch:

permissions:
  contents: read

# Runs alongside the regular updates instead of blocking them for hours. It saves its
# own copy of cache/ at the end, and the next regular update picks that copy up.
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's limit is 6 hours; the backfill saves progress and resumes if cut off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-
      - run: node backfill.js
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: news-cache-${{ github.run_id }}
